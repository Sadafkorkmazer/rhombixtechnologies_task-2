name: digital_art_gallery
description: "A digital art gallery app where users can explore and showcase artwork."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: 4.13.0
  cloud_firestore: ^6.0.2

dependency_overrides:
  firebase_core_web: 3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/